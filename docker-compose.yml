version: '3.9'

services:
  # ─────────────────────────────────────────
  #  Redis Cache
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fetchly-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  #  Backend API
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fetchly-backend
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=/app/data/fetchly.db
      - CORS_ORIGIN=http://localhost:3000
      - ADMIN_API_KEY=${ADMIN_API_KEY:-change-me}
      - YTDLP_PATH=yt-dlp
      - FFMPEG_PATH=ffmpeg
    volumes:
      - backend_data:/app/data
      - downloads:/app/downloads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────
  #  Frontend
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000/api
        - NEXT_PUBLIC_APP_NAME=FetchLy
    container_name: fetchly-frontend
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  backend_data:
  downloads:
